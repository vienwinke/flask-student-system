{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>仪表盘</h1>
    <p class="text-muted">学生成绩系统总览</p>
</div>

<div class="stats-grid" id="statsGrid">
    <div class="stat-card"><i class="bi bi-people"></i><div><span class="stat-num" id="statStudents">-</span><span class="stat-label">学生总数</span></div></div>
    <div class="stat-card"><i class="bi bi-journal-text"></i><div><span class="stat-num" id="statScores">-</span><span class="stat-label">成绩记录</span></div></div>
    <div class="stat-card"><i class="bi bi-book"></i><div><span class="stat-num" id="statSubjects">-</span><span class="stat-label">学科数</span></div></div>
    <div class="stat-card"><i class="bi bi-sliders2"></i><div><span class="stat-num" id="statWeights">-</span><span class="stat-label">权重配置</span></div></div>
</div>

<div class="card">
    <div class="card-header">
        <h2><i class="bi bi-trophy"></i> 成绩 Top 5</h2>
    </div>
    <div class="card-body">
        <table class="table" id="top5Table">
            <thead><tr><th>姓名</th><th>科目</th><th>成绩</th></tr></thead>
            <tbody id="top5Body"></tbody>
        </table>
    </div>
</div>
{% endblock %}
