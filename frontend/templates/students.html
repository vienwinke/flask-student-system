{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>学生管理</h1>
    <p class="text-muted">查看所有学生及其成绩概况</p>
</div>

<div class="card">
    <div class="card-header">
        <h2><i class="bi bi-people-fill"></i> 学生列表</h2>
        <div style="display:flex;gap:8px;align-items:center"><button class="btn btn-primary" onclick="showAddStudent()"><i class="bi bi-plus-lg"></i> 添加学生</button><button class="btn btn-outline" onclick="showImportExcel()"><i class="bi bi-file-earmark-excel"></i> 导入Excel</button></div>
        <div class="search-bar">
            <i class="bi bi-search"></i>
            <input type="text" id="studentSearch" placeholder="搜索学号或姓名..." oninput="filterStudents()">
        </div>
    </div>
    <div class="card-body">
        <table class="table" id="studentTable">
            <thead>
                <tr><th>学号</th><th>姓名</th><th>课程数</th><th>平均分</th><th>操作</th><th></th></tr>
            </thead>
            <tbody id="studentBody"></tbody>
        </table>
    </div>
</div>

<!-- 添加学生弹窗 -->
<div class="modal-overlay" id="addStudentModal" onclick="closeAddModal()">
    <div class="modal modal-sm" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3><i class="bi bi-person-plus"></i> 添加学生</h3>
            <button class="btn-close" onclick="closeAddModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div id="addStudentForm">
                <div class="form-group">
                    <label>学号</label>
                    <input type="text" name="sid" required placeholder="如 001">
                </div>
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" name="sname" required placeholder="如 张三">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeAddModal()">取消</button>
                    <button type="button" class="btn btn-primary" onclick="doAddStudent()">确认添加</button>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- 修改姓名弹窗 -->
<div class="modal-overlay" id="editStudentModal" onclick="closeAddModal()">
    <div class="modal modal-sm" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3><i class="bi bi-pencil"></i> 修改姓名</h3>
            <button class="btn-close" onclick="closeAddModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div id="editStudentForm">
                <div class="form-group">
                    <label>学号</label>
                    <input type="text" id="editSid" readonly style="background:#f5f5f5">
                </div>
                <div class="form-group">
                    <label>新姓名</label>
                    <input type="text" id="editSname" placeholder="输入新姓名">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeAddModal()">取消</button>
                    <button type="button" class="btn btn-primary" onclick="doEditStudent()">确认修改</button>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- 学生详情弹窗 -->
<div class="modal-overlay" id="studentModal" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 id="modalTitle">学生详情</h3>
            <button class="btn-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<!-- 导入Excel弹窗 -->
<div class="modal-overlay" id="importModal" onclick="closeAddModal()">
    <div class="modal modal-sm" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3><i class="bi bi-file-earmark-excel"></i> 导入Excel</h3>
            <button class="btn-close" onclick="closeAddModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div id="importForm">
                <div class="form-group">
                    <label>选择Excel文件</label>
                    <input type="file" id="importFile" accept=".xlsx,.xls">
                </div>
                <div class="import-note">
                    支持列：<strong>学号</strong>、<strong>姓名</strong>（导入学生）<br>
                    　　　<strong>学号</strong>、<strong>科目</strong>、<strong>平时分</strong>、<strong>期末分</strong>（导入成绩）<br>
                    可同时包含两种数据。已存在的学号/成绩会自动跳过或更新。
                </div>
                <div id="importResult" style="display:none"></div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeAddModal()">取消</button>
                    <button type="button" class="btn btn-primary" onclick="doImportExcel()" id="importBtn"><i class="bi bi-upload"></i> 开始导入</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
