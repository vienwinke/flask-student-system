{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>学科权重</h1>
    <p class="text-muted">各学科平时分与期末分的权重配置</p>
</div>

<div class="card">
    <div class="card-header">
        <h2><i class="bi bi-sliders"></i> 权重列表</h2>
        <button class="btn btn-primary" onclick="showAddWeight()"><i class="bi bi-plus-lg"></i> 添加权重</button>
    </div>
    <div class="card-body">
        <table class="table" id="weightTable">
            <thead>
                <tr><th>学科</th><th>平时权重 a</th><th>期末权重 b</th><th>学生人数</th><th>公式</th><th></th></tr>
            </thead>
            <tbody id="weightBody"></tbody>
        </table>
    </div>
</div>

<!-- 添加权重弹窗 -->
<div class="modal-overlay" id="addWeightModal" onclick="closeAddModal()">
    <div class="modal modal-sm" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3><i class="bi bi-sliders"></i> 添加/修改权重</h3>
            <button class="btn-close" onclick="closeAddModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div id="addWeightForm">
            <div class="form-group">
                    <label>学科名称</label>
                    <input type="text" name="subject" required placeholder="如 数学">
                </div>
                <div class="form-group">
                    <label>平时权重 a（0.0 ~ 1.0）</label>
                    <input type="number" name="weight" required min="0" max="1" step="0.05" value="0.50">
                </div>
                <div class="form-note">期末权重 b 自动为 1 - a</div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeAddModal()">取消</button>
                    <button type="button" class="btn btn-primary" onclick="doAddWeight()">确认保存</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
