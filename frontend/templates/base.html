<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生成绩管理系统</title>
    <link rel="stylesheet" href="/static/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="bi bi-mortarboard-fill"></i>
            <span>成绩管理系统</span>
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">
                <i class="bi bi-speedometer2"></i> 仪表盘
            </a>
            <a href="/students" class="nav-item {% if request.path == '/students' %}active{% endif %}">
                <i class="bi bi-people-fill"></i> 学生管理
            </a>
            <a href="/scores" class="nav-item {% if request.path == '/scores' %}active{% endif %}">
                <i class="bi bi-table"></i> 成绩列表
            </a>
            <a href="/weights" class="nav-item {% if request.path == '/weights' %}active{% endif %}">
                <i class="bi bi-sliders"></i> 学科权重
            </a>
        </nav>
        <div class="sidebar-footer">
            <i class="bi bi-database"></i> student_sys
        </div>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
